<!DOCTYPE html>
<html>
<head>
  <title>SyncForge 🔥</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body {
      font-family: Arial;
      display: flex;
      height: 100vh;
      margin: 0;
    }

    .left {
      flex: 2;
      padding: 10px;
    }

    .right {
      flex: 1;
      border-left: 2px solid #ccc;
      padding: 10px;
    }

    textarea {
      width: 100%;
      height: 60%;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    button {
      margin: 5px;
      padding: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="left">
  <h2>💻 SyncForge Editor</h2>

  <input id="roomId" placeholder="Room ID">
  <button onclick="joinRoom()">Join</button>

  <textarea id="editor" placeholder="Start coding..."></textarea>
</div>

<div class="right">
  <h3>👥 Participants</h3>
  <ul id="users"></ul>

  <h3>💬 Chat</h3>
  <input id="message" placeholder="Message">
  <button onclick="sendMessage()">Send</button>

  <ul id="chat"></ul>
</div>

<script>
const socket = io("http://localhost:5001", {
  auth: {
    token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY5ZWUwYWVlNmI2M2U4ODgxNGM5NTdlOCIsImlhdCI6MTc3NzIwODA5MCwiZXhwIjoxNzc3Mjk0NDkwfQ.H1Bj9smmBGq5UXUPeq6unNzrHGSaYwER7aQf4MV3Scw"
  }
});
  let currentRoom = "";
  let userId = Math.random().toString(36).substring(7);
socket.on("joined-success", (roomId) => {
  console.log("✅ Joined room:", roomId);
});

socket.on("receive-message", (msg) => {
  console.log("📥 RECEIVED:", msg);
});
  function joinRoom() {
    currentRoom = document.getElementById("roomId").value;

    if (!currentRoom) {
      alert("Enter Room ID");
      return;
    }

    socket.emit("join-room", { roomId: currentRoom, userId });

    alert("Joined room: " + currentRoom);
  }

  // CODE
  const editor = document.getElementById("editor");

  editor.addEventListener("input", () => {
    socket.emit("code-change", {
      roomId: currentRoom,
      code: editor.value
    });
  });

  socket.on("code-update", (code) => {
    if (editor.value !== code) {
      editor.value = code;
    }
  });

  // CHAT
  function sendMessage() {
    if (!currentRoom) {
      alert("Join a room first");
      return;
    }

    const msg = document.getElementById("message").value;

    socket.emit("send-message", {
      roomId: currentRoom,
      message: msg
    });

    const li = document.createElement("li");
    li.textContent = "You: " + msg;
    document.getElementById("chat").appendChild(li);

    document.getElementById("message").value = "";
  }

  socket.on("receive-message", (msg) => {
    const li = document.createElement("li");
    li.textContent = msg;
    document.getElementById("chat").appendChild(li);
  });

  // PARTICIPANTS
  socket.on("participants", (users) => {
    const list = document.getElementById("users");
    list.innerHTML = "";

    users.forEach(user => {
      const li = document.createElement("li");
      li.textContent = user.userId;
      list.appendChild(li);
    });
  });
</script>

</body>
</html>
