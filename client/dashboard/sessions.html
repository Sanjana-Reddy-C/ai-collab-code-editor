<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Sessions Analytics</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Segoe UI;
    }

    body{
      background:#f1f5f9;
      display:flex;
      color:#0f172a;
    }

    /* SIDEBAR */

    .sidebar{
      width:260px;
      height:100vh;
      background:white;
      border-right:1px solid #e2e8f0;
      padding:30px 20px;
      position:fixed;
    }

    .logo{
      font-size:46px;
      font-weight:bold;
      color:#2563eb;
      margin-bottom:50px;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .nav a{
      text-decoration:none;
      color:#334155;
      font-size:21px;
      padding:16px;
      border-radius:14px;
      transition:0.3s;
    }

    .nav a:hover{
      background:#eff6ff;
    }

    .active{
      background:#2563eb;
      color:white !important;
    }

    /* MAIN */

    .main{
      margin-left:260px;
      width:calc(100% - 260px);
      padding:40px;
    }

    .title{
      font-size:52px;
      font-weight:bold;
      margin-bottom:40px;
    }

    /* CARDS */

    .sessions-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(450px,1fr));
      gap:30px;
    }

    .session-card{
      background:white;
      border-radius:24px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.06);
      transition:0.3s;
    }

    .session-card:hover{
      transform:translateY(-6px);
    }

    .room-title{
      font-size:32px;
      font-weight:bold;
      color:#2563eb;
      margin-bottom:22px;
    }

    .stat{
      font-size:20px;
      color:#334155;
      margin-bottom:16px;
    }

    .users-title{
      margin-top:24px;
      margin-bottom:18px;
      font-size:22px;
      font-weight:bold;
    }

    .user{
      background:#f8fafc;
      padding:14px;
      border-radius:14px;
      margin-bottom:12px;
      font-size:18px;
      color:#2563eb;
      font-weight:bold;
    }

    .status{
      display:inline-block;
      padding:8px 16px;
      border-radius:999px;
      font-size:15px;
      font-weight:bold;
      margin-top:14px;
    }

    .active-status{
      background:#dcfce7;
      color:#166534;
    }

    .ended-status{
      background:#fee2e2;
      color:#991b1b;
    }

  </style>

</head>

<body>

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="logo">
      🚀 CollabCode
    </div>

    <div class="nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="users.html">👥 Users</a>
      <a href="rooms.html">🏠 Rooms</a>
      <a class="active" href="sessions.html">⏱ Sessions</a>
      <a href="ai.html">🤖 AI Insights</a>
    </div>

  </div>

  <!-- MAIN -->

  <div class="main">

    <div class="title">
      ⏱ Sessions Analytics
    </div>

    <div class="sessions-grid" id="sessionsGrid"></div>

  </div>

  <script>

    async function loadSessions(){

      const res =
        await fetch("http://localhost:3000/api/analytics/sessions");

      const data =
        await res.json();

      const container =
        document.getElementById("sessionsGrid");

      container.innerHTML = "";

      data.sessions.forEach(session => {

        let usersHTML = "";

        session.users.forEach(user => {

          usersHTML += `
            <div class="user">
              👤 ${user}
            </div>
          `;

        });

        const statusClass =
          session.status === "Active"
            ? "active-status"
            : "ended-status";

        container.innerHTML += `

          <div class="session-card">

            <div class="room-title">
              Room ${session.roomId}
            </div>

            <div class="stat">
              👥 Users:
              <b>${session.users.length}</b>
            </div>

            <div class="stat">
              🕒 Started:
              <b>${new Date(session.startTime)
                .toLocaleString()}</b>
            </div>

            <div class="stat">
              ⏳ Duration:
              <b>${session.duration}</b>
            </div>

            <div class="status ${statusClass}">
              ${session.status}
            </div>

            <div class="users-title">
              Participants
            </div>

            ${usersHTML}

          </div>

        `;

      });

    }

    loadSessions();
    setInterval(() => {

  location.reload();

}, 10000);

  </script>

</body>

</html>
