<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Rooms Analytics</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Segoe UI;
    }

    body{
      background:#f1f5f9;
      display:flex;
      color:#0f172a;
    }

    /* SIDEBAR */

    .sidebar{
      width:260px;
      height:100vh;
      background:white;
      border-right:1px solid #e2e8f0;
      padding:30px 20px;
      position:fixed;
      left:0;
      top:0;
    }

    .logo{
      font-size:46px;
      font-weight:bold;
      color:#2563eb;
      margin-bottom:50px;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .nav a{
      text-decoration:none;
      color:#334155;
      font-size:21px;
      padding:16px;
      border-radius:14px;
      transition:0.3s;
    }

    .nav a:hover{
      background:#eff6ff;
    }

    .active{
      background:#2563eb;
      color:white !important;
    }

    /* MAIN */

    .main{
      margin-left:260px;
      width:calc(100% - 260px);
      padding:40px;
    }

    .title{
      font-size:52px;
      font-weight:bold;
      margin-bottom:40px;
    }

    /* GRID */

    .rooms-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(450px,1fr));
      gap:30px;
    }

    .room-card{
      background:white;
      border-radius:24px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.06);
      transition:0.3s;
    }

    .room-card:hover{
      transform:translateY(-6px);
    }

    .room-id{
      font-size:34px;
      font-weight:bold;
      color:#2563eb;
      margin-bottom:20px;
    }

    .room-stat{
      margin-bottom:18px;
      font-size:20px;
      color:#334155;
    }

    .contributors-title{
      margin-top:28px;
      margin-bottom:20px;
      font-size:24px;
      font-weight:bold;
      color:#0f172a;
    }

    .contributor{
      background:#f8fafc;
      padding:18px;
      border-radius:18px;
      margin-bottom:16px;
    }

    .contributor-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    }

    .contributor-name{
      font-size:20px;
      font-weight:bold;
      color:#2563eb;
    }

    .rank{
      background:linear-gradient(to right,#2563eb,#7c3aed);
      color:white;
      padding:8px 14px;
      border-radius:999px;
      font-size:14px;
      font-weight:bold;
    }

    .progress-container{
      width:100%;
      height:14px;
      background:#e2e8f0;
      border-radius:999px;
      overflow:hidden;
      margin-top:10px;
    }

    .progress-bar{
      height:100%;
      background:linear-gradient(to right,#2563eb,#7c3aed);
      border-radius:999px;
    }

  </style>

</head>

<body>

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="logo">
      🚀 CollabCode
    </div>

    <div class="nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="users.html">👥 Users</a>
      <a class="active" href="rooms.html">🏠 Rooms</a>
      <a href="sessions.html">⏱ Sessions</a>
      <a href="ai.html">🤖 AI Insights</a>
    </div>

  </div>

  <!-- MAIN -->

  <div class="main">

    <div class="title">
      🏠 Rooms Analytics
    </div>

    <div class="rooms-grid" id="roomsGrid"></div>

  </div>

  <script>

    async function loadRooms(){

      const res =
        await fetch("http://localhost:3000/api/analytics/rooms");

      const data =
        await res.json();

      const container =
        document.getElementById("roomsGrid");

      container.innerHTML = "";

      data.rooms.forEach(room => {

        let contributorsHTML = "";

        room.topContributors.forEach(user => {

          const percentage =
            ((user.edits / room.totalEdits) * 100).toFixed(1);

          let medal = "🏅";

          if(user.rank === 1) medal = "🥇";
          if(user.rank === 2) medal = "🥈";
          if(user.rank === 3) medal = "🥉";

          contributorsHTML += `

            <div class="contributor">

              <div class="contributor-top">

                <div class="contributor-name">
                  ${user.username}
                </div>

                <div class="rank">
                  ${medal} Rank ${user.rank}
                </div>

              </div>

              <div class="room-stat">
                ✏️ Contributions:
                <b>${user.edits}</b>
              </div>

              <div class="room-stat">
                📊 Room Contribution:
                <b>${percentage}%</b>
              </div>

              <div class="progress-container">

                <div
                  class="progress-bar"
                  style="width:${percentage}%">
                </div>

              </div>

            </div>

          `;

        });

        container.innerHTML += `

          <div class="room-card">

            <div class="room-id">
              Room ${room.roomId}
            </div>

            <div class="room-stat">
              ✏️ Total Room Edits:
              <b>${room.totalEdits}</b>
            </div>

            <div class="room-stat">
              👥 Contributors:
              <b>${room.topContributors.length}</b>
            </div>

            <div class="contributors-title">
              Top Contributors
            </div>

            ${contributorsHTML}

          </div>

        `;

      });

    }

    loadRooms();
    setInterval(() => {

  location.reload();

}, 10000);
  </script>

</body>

</html>
